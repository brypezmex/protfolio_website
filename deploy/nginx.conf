# ---------------------------------------------------------------------------
# nginx configuration for the portfolio.
#
# This is the reference deployment shape: nginx serves the static React build
# and reverse-proxies /api to Gunicorn on the same host. Because both are on one
# origin, the browser makes plain relative requests to /api/... and no CORS
# headers are needed anywhere - leave ALLOWED_ORIGINS empty in backend/.env.
#
# Install as /etc/nginx/sites-available/portfolio and symlink into
# sites-enabled, or drop into conf.d/. Then:
#     sudo nginx -t && sudo systemctl reload nginx
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name bryanperez.dev www.bryanperez.dev;

    # Certbot writes its challenge here; everything else goes to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bryanperez.dev www.bryanperez.dev;

    # Issue with: sudo certbot --nginx -d bryanperez.dev -d www.bryanperez.dev
    ssl_certificate     /etc/letsencrypt/live/bryanperez.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bryanperez.dev/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Where `npm run build` output was copied.
    root /var/www/portfolio;
    index index.html;

    # ---- Security headers -------------------------------------------------

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # The site loads fonts from Google and talks only to its own origin.
    # 'unsafe-inline' for style-src is required because Vite inlines a small
    # style block and components set CSS custom properties inline.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # ---- Compression ------------------------------------------------------

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # ---- API --------------------------------------------------------------

    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Every endpoint answers in milliseconds; outbound calls are cached
        # server-side and have their own short timeouts.
        proxy_connect_timeout 5s;
        proxy_read_timeout    20s;

        # Nothing this API returns should be cached by a proxy.
        proxy_buffering off;
    }

    # ---- Static assets ----------------------------------------------------

    # Vite fingerprints every file in /assets, so they are safe to cache
    # forever. A new build produces new filenames.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /resume/resume.pdf {
        expires 1h;
        add_header Cache-Control "public";
    }

    # index.html must never be cached, or visitors keep loading the old build's
    # asset references after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
