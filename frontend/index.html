<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f0f0f" />

    <title>Bryan Perez - Software Engineer</title>
    <meta
      name="description"
      content="Bryan Perez is a Computer Science student at NC State building full-stack systems with React, Python, Java, and Spring Boot. Selected work includes NoirMore, an AI fact-checking platform, and WolfCafe, a role-based ordering system."
    />
    <meta name="author" content="Bryan Perez" />

    <!--
      Canonical + Open Graph URLs.
      Replace https://bryanperez.dev with the real domain once DNS is pointed at
      the home server. These are the only hardcoded absolute URLs in the app.
    -->
    <link rel="canonical" href="https://bryanperez.dev/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bryan Perez" />
    <meta property="og:title" content="Bryan Perez - Software Engineer" />
    <meta
      property="og:description"
      content="Computer Science at NC State. Full-stack engineering with React, Python, Java, and Spring Boot."
    />
    <meta property="og:url" content="https://bryanperez.dev/" />
    <meta property="og:image" content="https://bryanperez.dev/og-image.svg" />
    <meta property="og:image:alt" content="Bryan Perez - Software Engineer" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bryan Perez - Software Engineer" />
    <meta
      name="twitter:description"
      content="Computer Science at NC State. Full-stack engineering with React, Python, Java, and Spring Boot."
    />
    <meta name="twitter:image" content="https://bryanperez.dev/og-image.svg" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!--
      The hero photograph is the largest element on the first screen. Preloading
      it here means the download starts with the HTML instead of waiting for the
      JS bundle to render the <img>. Keep in sync with PORTRAIT in Hero.jsx.
    -->
    <link
      rel="preload"
      as="image"
      href="/images/hero-1448.jpg"
      imagesrcset="/images/hero-800.jpg 800w, /images/hero-1448.jpg 1448w"
      imagesizes="100vw"
      fetchpriority="high"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Inter Tight sets everything; Instrument Serif (italic) is used for
      accent letters in headings, index numbers, and the odd editorial
      flourish. Both are SIL Open Font License 1.1 - see ATTRIBUTIONS.md.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap"
    />

    <!--
      Structured data. Helps search engines associate the site with the person
      rather than treating it as an anonymous page.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Bryan Perez",
        "url": "https://bryanperez.dev/",
        "email": "mailto:bryanp0138@gmail.com",
        "jobTitle": "Software Engineer",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Raleigh",
          "addressRegion": "NC",
          "addressCountry": "US"
        },
        "alumniOf": {
          "@type": "CollegeOrUniversity",
          "name": "North Carolina State University"
        },
        "knowsAbout": [
          "Java",
          "Python",
          "JavaScript",
          "C",
          "R",
          "React",
          "Flask",
          "Spring Boot",
          "MySQL",
          "REST APIs"
        ],
        "sameAs": [
          "https://github.com/brypezmex",
          "https://www.linkedin.com/in/bryan-perez23"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
